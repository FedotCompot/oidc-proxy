# Example wiring: a static site behind Traefik, gated by oidc-proxy.
#
# Routes:
#   app.example.com/oauth2/*  -> oidc-proxy (no auth middleware)
#   app.example.com/*         -> static site (auth middleware -> oidc-proxy /verify)

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  oidc-proxy:
    image: oidc-proxy:latest
    environment:
      OIDC_ISSUER: https://accounts.google.com
      OIDC_CLIENT_ID: your-client-id.apps.googleusercontent.com
      # Optional access control:
      # ALLOWED_DOMAINS: example.com,example.org
      # ALLOWED_EMAILS: alice@example.com,bob@example.com
      # Optional cosmetics:
      # SIGN_IN_TITLE: "Acme intranet"
      # SIGN_IN_BUTTON: "Sign in with Google"
      #
      # --- MCP OAuth 2.1 Authorization Server (off by default) --------------
      # Turn oidc-proxy into an MCP auth gateway for AI-agent clients. See the
      # "MCP authorization" section of the README. Generate the ES256 key with:
      #   openssl ecparam -name prime256v1 -genkey -noout
      # The key MUST be identical across replicas/restarts (mount a secret;
      # never generate per pod).
      # MCP_ENABLED: "true"
      # MCP_ISSUER: https://app.example.com
      # MCP_RESOURCE: https://app.example.com/mcp
      # MCP_SIGNING_KEY_FILE: /run/secrets/mcp_signing_key
      # MCP_ACCESS_TOKEN_TTL: 15m
      # MCP_REFRESH_TOKEN_TTL: 8h
      # Client ID Metadata Documents are on by default; narrow which hosts may
      # publish them with:
      # MCP_CIMD_ALLOWED_HOSTS: claude.ai,*.cursor.sh
      # ALLOWED_DOMAINS also gates MCP access.
    labels:
      - traefik.enable=true
      # The auth-middleware Traefik uses to gate the static site.
      - traefik.http.middlewares.oidc-auth.forwardauth.address=http://oidc-proxy:8080/verify
      - traefik.http.middlewares.oidc-auth.forwardauth.authResponseHeaders=X-Auth-Request-Email,X-Auth-Request-User
      # Public router for /oauth2/* (sign-in, start, callback, refresh, sign_out).
      - traefik.http.routers.oidc-proxy.rule=Host(`app.example.com`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oidc-proxy.entrypoints=websecure
      - traefik.http.routers.oidc-proxy.tls=true
      - traefik.http.services.oidc-proxy.loadbalancer.server.port=8080
      # --- MCP wiring (uncomment alongside MCP_ENABLED above) ---------------
      # Public router for MCP discovery documents (no auth middleware):
      # - traefik.http.routers.oidc-mcp-wellknown.rule=Host(`app.example.com`) && (PathPrefix(`/.well-known/oauth-protected-resource`) || PathPrefix(`/.well-known/oauth-authorization-server`) || PathPrefix(`/.well-known/openid-configuration`))
      # - traefik.http.routers.oidc-mcp-wellknown.entrypoints=websecure
      # - traefik.http.routers.oidc-mcp-wellknown.tls=true
      # forwardAuth middleware for the MCP resource server (bearer tokens):
      # - traefik.http.middlewares.mcp-auth.forwardauth.address=http://oidc-proxy:8080/mcp-verify
      # - traefik.http.middlewares.mcp-auth.forwardauth.authResponseHeaders=X-Auth-Request-Email,X-Auth-Request-User
      # Apply mcp-auth@docker to your /mcp router (points at the MCP server).

  site:
    image: nginx:alpine
    volumes:
      - ./public:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`app.example.com`)
      - traefik.http.routers.site.entrypoints=websecure
      - traefik.http.routers.site.tls=true
      - traefik.http.routers.site.middlewares=oidc-auth@docker
      - traefik.http.services.site.loadbalancer.server.port=80

# At your OIDC provider, register a client (SPA / public, no secret) with
# redirect URI: https://app.example.com/oauth2/callback
